# ============================================================
# 附表 / 附件 / 附图 (原件第 21—22 页)
# ============================================================
# 本节只登记清单, 制品台账与校验属 P0-07 (C 批), 此处不计入内容覆盖率。
attachments:
  tables:
    - 防治责任范围统计表（涉及两个及以上行政区）
    - 水土流失防治指标计算表（涉及两个及以上防治标准）
    - 投资附件
  documents:
    - 项目立项或相关支撑性文件
    - 不可避让论证情况及结论（开展不可避让专题论证的）
    - 取土场、弃渣场及永久占地范围外临时堆土场的管理部门及土地权属单位确认意见
    - 外购土石方的意向协议及土源支撑性材料
    - 4 级及以上弃渣场地质勘察报告结论
    - 弃渣综合利用或表土再利用的支撑性材料
    - 其他支撑材料（失事影响专题分析报告等专题报告单册另附）
  figures:
    - 地理位置图
    - 项目区水系图
    - 项目区土壤侵蚀图
    - 水土流失防治责任范围图（需提供完整的防治责任范围 shapefile 格式矢量数据）
    - 工程总体平面布置图
    - 竖向布置图
    - 监测点布置图
    - 防治责任范围内林草植被分布图
    - 表土资源调查点位布设图
    - 项目区表土分布与剥离范围图
    - 分区防治措施总体布局图
    - 典型设计图
    - 取土场和弃渣场（含临时堆土场）位置图（含地形和影像图）
