# ============================================================
# stable ID 迁移说明 (04 文档第 6 节)
# ============================================================
# 只登记"显示位置发生变化"的条目。ID 一律不动。
stable_id_migrations:
  - stable_id: sec.conclusion
    old_display: '11'
    old_source: governance/DisplayNumberingPolicy_v0.yaml (display_numbering_policy_v0.1)
    new_display: '1.9'
    reason: |
      2026 模板的主体章止于第 10 章"水土保持管理", 没有第 11 章。
      结论是综合说明的末节 1.9。原 DisplayNumberingPolicy_v0 把它编为第 11 章。
    review_reference_note: |
      历史审查意见若按"第 11 章"定位结论, 仍指向 sec.conclusion;
      引用时应注明其为 v0.1 编号语境。

  - stable_id: sec.soil_loss_prevention.benefit_analysis
    old_display: '7.5'
    old_source: governance/DisplayNumberingPolicy_v0.yaml
    new_display: '9.2'
    cross_chapter: true
    reason: |
      2026 模板把效益分析放在第 9 章"水土保持投资及效益分析"之下 (9.2),
      不在第 7 章。这是一次跨章迁移。
    review_reference_note: |
      stable ID 保留。按"7.5"定位效益分析的历史意见仍可解析到本节。

  - stable_id: sec.soil_loss_prevention.design_horizon
    old_display: '7.3'
    new_display: '7.2'
    reason: 2026 模板中 7.2 为设计水平年, 7.3 为防治目标; 原编号把二者对调了。

  - stable_id: sec.soil_loss_prevention.targets
    old_display: '7.2'
    new_display: '7.3'
    reason: 同上, 与 design_horizon 互换。

  - stable_id: sec.investment_estimation.compensation_fee
    old_display: '9.2'
    new_display: '9.1.2'
    reason: |
      2026 模板的 9.2 是效益分析。补偿费属于 9.1 投资估算的估算成果内容
      (9.1.2 明列"水土保持补偿费计算表"), 不单独占用 9.2。

# ============================================================
# 被吸收 / 悬空的既有 stable ID
# ============================================================
# 这些 ID 在 v0.1 里是独立显示节, 但在 2026 模板里没有对应的独立编号 ——
# 它们的内容被并进了别的节。**不得静默丢弃**: 否则按旧编号定位的审查意见
# 会失联 (03 文档 P0-05 第 8 条)。
absorbed_stable_ids:
  - stable_id: sec.investment_estimation.compensation_fee
    absorbed_into: req.t2026.9.1.2
    display_hint: 9.1.2（估算成果之一）
    reason: |
      2026 模板 9.1.2"编制说明与估算成果"明列"水土保持补偿费计算表"为估算成果
      之一, 补偿费不单独占用一个编号 (9.2 是效益分析)。
    status: ACTIVE_CONTENT      # 内容仍产出, 只是不再独立编号

  - stable_id: sec.project_overview.water_soil_zoning
    absorbed_into: req.t2026.1.1.2
    also_referenced_by: [req.t2026.table_1]
    display_hint: 1.1.2（自然简况）/ 表1（涉及水土保持区划）
    reason: |
      2026 模板 2.7 自然概况的七个子项 (地质/地貌/气候气象/水文/土壤/植被/
      敏感区) 中**没有**独立的"水土保持区划"节。区划出现在 1.1.2 自然简况
      的表述要求里, 以及表 1 特性表的"涉及水土保持区划"栏。
    status: ACTIVE_CONTENT
    note: |
      该节当前由 sec_2_3_climate_zoning.render_zoning 产出, 显示位置需在
      renderer 层迁移。本轮只登记映射, 不改 renderer 的章节树 (见差异表)。

  - stable_id: sec.soil_loss_prevention.responsibility_range_by_county
    absorbed_into: req.t2026.7.1
    also_referenced_by: [attachments.tables.防治责任范围统计表]
    display_hint: 7.1（按县级行政区分别列明）+ 附表
    reason: |
      2026 模板 7.1 要求"按县级行政区和水土流失防治分区分别列明涉及的水土
      流失防治责任范围及面积", 并在附表中要求"防治责任范围统计表(涉及两个
      及以上行政区)"。分县内容属 7.1 的组成部分, 不是独立编号节。
    status: ACTIVE_CONTENT

