# ReportContentRequirements_v1 — 报告书内容规范清单
#
# 任务来源: docs/report_production_plan/03_P0_TASKS.md P0-05
# 批准记录: implementation/DECISION_LOG.md 条目 008 (B 批) / 条目 010 (本文件)
#
# 本文件把"2026 模板要求什么"变成机器可读的叶子要求清单, 供:
#   1. 质量层计算内容完成度 (分母 = 适用叶子要求, 验收 Q01/Q02/R02)
#   2. 章节显示位置绑定 (stable ID → display_number)
#   3. "正式模板要求—stable ID—显示位置—实现状态"差异表
#
# ============================================================
# 硬约束
# ============================================================
# 1. **stable ID 不改名。** 显示位置变了就改 display_number, 不动 stable_id ——
#    改名会让历史审查意见的定位全部失联 (04 文档第 6 节)。
#    典型: sec.conclusion 显示位置从"第 11 章"迁到"1.9", ID 保持不变;
#         sec.soil_loss_prevention.benefit_analysis 跨章迁到 9.2, ID 保持不变。
# 2. **未实现不等于不要求。** implemented: false 的要求**仍进覆盖率分母**,
#    不得因为模板没写就不计分 (验收 R02)。
# 3. 本文件只描述"模板要求什么", **不描述任何项目的事实**。

