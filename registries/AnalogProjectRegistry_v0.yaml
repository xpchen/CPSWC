# AnalogProjectRegistry v0
#
# 水土流失预测类比工程登记表 (G-11)
#
# 用途:
#   narrative §7.4.3 (sec.soil_loss_analysis.prediction_result) 在采用类比法时,
#   必须实名引用一个真实存在的、已通过水保方案审批的类比工程, 并给出
#   与本项目的 6 维度可比性论证 (地理位置 / 气候 / 土壤 / 植被 / 地形 / 水保状况);
#   不允许用"匿名典型经验值"代替类比工程实名.
#
# 字段引用方:
#   field.fact.prediction.analog_project_ref — 项目级 binding (string id)
#
# 来源:
#   v0 初始库基于惠州 4 份真实房地产/工业建设样稿 §7.4.3 中实际引用的类比工程
#   提取; 后续随样稿 dossier 02-05 推进扩库.
#
# 注意:
#   - 模数 zone_modulus 单位 t/(km²·a); 施工期 / 自然恢复期分列
#   - 模数值取自类比工程"实测监测数据"或其方案附表, 不允许凭经验估算
#   - 类比工程的"适用行业 / 适用地区"是软约束, 选取时须人工复核可比性

