  rule.ministry_order_53:
    document_title: 生产建设项目水土保持方案管理办法
    document_number: 中华人民共和国水利部令第 53 号
    issuing_authority: 中华人民共和国水利部
    authority_class: 部门规章
    issued_at: '2023-01-17'
    effective_from: '2023-03-01'
    clause_ref: 第七条
    quoted_text: |
      第七条 水土保持方案分为报告书和报告表。
      征占地面积5公顷以上或者挖填土石方总量5万立方米以上的生产建设项目，
      应当编制水土保持方案报告书。征占地面积0.5公顷以上、不足5公顷或者
      挖填土石方总量1000立方米以上、不足5万立方米的生产建设项目，应当编制
      水土保持方案报告表。
      征占地面积不足0.5公顷并且挖填土石方总量不足1000立方米的生产建设项目，
      不需要编制水土保持方案，但应当按照水土保持有关技术标准做好水土流失防治工作。
    source_file: docs/refs/01_国家法律规章/03_生产建设项目水土保持方案管理办法_水利部令53号.pdf
    source_locator: 正文第一章总则后, 文字层第 57-62 行
