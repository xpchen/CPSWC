# 已知未登记 (刻意留白, 不是遗漏)
# ============================================================
# `rule.t2026.*` 共 25 个 ID 全部未登记。
#
# 原因: ObligationSet_v0.yaml 的头部自述覆盖"2026 模板 / 2018 格式 /
