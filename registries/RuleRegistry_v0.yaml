# CPSWC RuleRegistry v0
#
# 功能: 把散落在 ObligationSet / CalculatorRegistry / AssuranceRegistry /
#      narrative 模板里的 `rule.*` 依据 ID 解析成"哪部规范的哪一条"。
#
# 为什么需要它:
#   前端接线完成后 (DECISION_LOG 条目 015) 清点出 **53 个 rule.* 依据 ID,
#   已登记标题 0 个**。报告里每一句"依据 XXX"都指向一个空壳 ——
#   无法向审查人员出示条文, 也无法核对引用是否正确。
#
# ============================================================
# 硬约束
# ============================================================
# 1. **不许推断来源。** 命名空间像什么不算证据。
#    典型: `rule.t2026.*` 的前缀看着像 2026 模板, 但 ObligationSet 的头部
#    自述是"2026 模板 / 2018 格式 / 广东惠州"的混合, 单条义务并未声明出处;
#    例如"弃渣场 4 级需地质报告"更可能出自 GB 51018 而非模板。
#    **没有登记来源就不进本文件**, 由调用方报 UNREGISTERED。
#
# 2. **verification_status 三态, 逐条声明:**
#      VERIFIED_TEXT — 条文原文已从本地原件抽取并核对, quoted_text 必须非空
#      DECLARED      — 已定位到具体文件 (可选到章/条), 但未抓取条文原文
#      (不在本文件中) → UNREGISTERED, 界面显示"系统不知道这个 ID 指向哪一条"
#
#    **DECLARED 不许写 quoted_text。** 写了就等于声称核对过。
#
# 3. **source_file 必须是仓库内真实存在的路径。** lint 会逐条检查文件在不在。
#    登记一个查不到的出处, 比不登记更糟 —— 它看起来像证据。
#
# 4. 本文件只描述"依据是什么", **不描述任何项目的事实**, 也不做合规判断。

