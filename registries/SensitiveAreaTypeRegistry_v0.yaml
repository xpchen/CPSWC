# SensitiveAreaTypeRegistry v0
#
# 水土保持敏感区"逐项排查"清单 (G-09)
#
# 用途:
#   narrative §2.x 敏感区 / §5.1 选址评价 强制按本清单逐项排查;
#   命中清单 facts.natural.other_sensitive_areas 中的 area_type 必须出自本表;
#   未命中的类型由 narrative 模板生成 "项目区不涉及..." 单句汇总段落.
#
# 来源:
#   清单 1~10 来源于 GB 50433-2018 §2.5 + 2018 模板示范用语 (惠州 4 份房地产/工业样稿一致采用);
#   清单 11 (生态保护红线) 为 2018+ "三区三线" 政策核心红线, 必查;
#   清单 12 (永久基本农田) 由 2026 模板 §2.5 显式增列.
#
# 不在本表的类型 (基本草原 / 国家公益林 / 自然保护地 umbrella) 已并入 5-10 子类或
# 移出 v0 canonical; 若审查口径要求, 可在后续版本扩列.
#
# 与 FieldIdentityRegistry.field.fact.natural.other_sensitive_areas.area_type 保持一致.

registry_id: SensitiveAreaTypeRegistry_v0
